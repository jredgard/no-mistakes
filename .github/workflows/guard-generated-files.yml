# Every upstream sync imports upstream's release files. Exempt a PR only when
# its author is the repository owner and both generated files at its head are
# byte-identical to upstream's current main.
name: Guard generated files

env:
  UPSTREAM_URL: https://github.com/kunchenguid/no-mistakes.git

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # Automation-owned release PRs keep their existing author exemption.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          violated=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              violated="${violated} ${path}"
            fi
          done

          if [ -n "$violated" ]; then
            if [ "$PR_AUTHOR" = "$REPOSITORY_OWNER" ]; then
              comparison_dir=$(mktemp -d)
              trap 'rm -rf "$comparison_dir"' EXIT
              if git fetch --no-tags "$UPSTREAM_URL" refs/heads/main; then
                upstream_sha=$(git rev-parse FETCH_HEAD)
                matches_upstream=1
                for path in CHANGELOG.md .release-please-manifest.json; do
                  if git show "${HEAD_SHA}:${path}" > "$comparison_dir/head" &&
                     git show "${upstream_sha}:${path}" > "$comparison_dir/upstream" &&
                     cmp -s "$comparison_dir/head" "$comparison_dir/upstream"; then
                    continue
                  fi
                  echo "Owner sync exemption does not apply: ${path} differs from upstream main or could not be read."
                  matches_upstream=0
                done
                if [ "$matches_upstream" -eq 1 ]; then
                  echo "Owner sync exemption: both generated files match upstream main. OK."
                  exit 0
                fi
              else
                echo "Owner sync exemption unavailable: could not fetch upstream main."
              fi
            fi
            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          echo "No release-please-generated files modified. OK."
